project:
  type: book
  output-dir: _book

book:
  title: "Jujutsu Book"
  subtitle: "Guia Prático de Jujutsu VCS com Quarto e uv"
  author: "Charles Duarte"
  date: last-modified

  repo-url: https://github.com/linduarte/jujutsu-book
  repo-actions: [edit, issue]
  site-url: https://linduarte.github.io/jujutsu-book/

  sidebar:
    style: "docked"
    search: true
    collapse-level: 2

  chapters:
    - index.qmd
    - topics/getting-started.md
    - topics/jj-learning-path.md
    - topics/jj-exercises.md
    - topics/jj_exerc_grok.md

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    respect-user-color-scheme: true
    page-layout: article
    toc: true
    toc-depth: 3
    toc-title: "Nesta página"
    number-sections: true
    code-copy: true
    code-fold: show
    highlight-style: github

execute:
  freeze: auto